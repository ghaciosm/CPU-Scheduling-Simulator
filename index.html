
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CPU Scheduling Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">

        <!-- HEADER -->
        <header>
            <h1>CPU Scheduling Simulator</h1>
            <p>Visualize and compare CPU scheduling algorithms.</p>
        </header>

        <!-- PROCESS MANAGEMENT -->
        <section class="card">
            <h2>Process Management</h2>

            <div class="input-group">
                <input type="text"
                       id="processId"
                       placeholder="Process ID (P1)">

                <input type="number"
                       id="arrivalTime"
                       placeholder="Arrival Time"
                       min="0"
                       step="1">

                <input type="number"
                       id="burstTime"
                       placeholder="CPU Burst"
                       min="1"
                       step="1">

                <button id="addProcessBtn">
                    Add Process
                </button>
            </div>

            <div class="table-wrapper">
                <table id="processTable">
                    <thead>
                        <tr>
                            <th>Process ID</th>
                            <th>Arrival Time</th>
                            <th>CPU Burst</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="processTableBody"></tbody>
                </table>
            </div>

            <div class="button-group">
                <button id="loadWorkloadA">
                    Load Workload A
                </button>

                <button id="loadWorkloadB">
                    Load Workload B
                </button>

                <button id="clearAllBtn"
                        class="danger-button">
                    Clear All
                </button>
            </div>
        </section>

        <!-- SCHEDULING CONFIGURATION -->
        <section class="card">
            <h2>Scheduling Configuration</h2>

            <div class="input-group">
                <label for="algorithm">Algorithm:</label>

                <select id="algorithm">
                    <option value="FCFS">FCFS</option>
                    <option value="SJF">SJF</option>
                    <option value="SRTF">SRTF</option>
                    <option value="RR">Round Robin</option>
                </select>

                <div id="quantumGroup"
                     class="quantum-group"
                     hidden>
                    <label for="quantum">
                        Time Quantum:
                    </label>

                    <input type="number"
                           id="quantum"
                           value="2"
                           min="1"
                           step="1">
                </div>
            </div>

            <div id="algorithmInfo"
                 class="algorithm-info"></div>

            <div class="simulation-actions">
                <button id="runBtn">
                    Run Simulation
                </button>

                <button id="resetBtn"
                        class="reset-button">
                    Reset Simulation
                </button>
            </div>
        </section>

        <!-- GANTT CHART -->
        <section class="card">
            <h2>Gantt Chart</h2>
            <div id="ganttChart"></div>
        </section>

        <!-- PROCESS RESULTS -->
        <section class="card">
            <h2>Process Results</h2>

            <div class="table-wrapper">
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <th>Process</th>
                            <th>Arrival</th>
                            <th>Burst</th>
                            <th>Start</th>
                            <th>Completion</th>
                            <th>Turnaround</th>
                            <th>Waiting</th>
                            <th>Response</th>
                        </tr>
                    </thead>

                    <tbody id="resultsTableBody"></tbody>
                </table>
            </div>
        </section>

        <!-- AVERAGE METRICS -->
        <section class="card">
            <h2>Average Metrics</h2>
            <div id="averageMetrics"></div>
        </section>

        <!-- ERROR MESSAGE -->
        <p id="errorMessage" role="alert"></p>

    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
